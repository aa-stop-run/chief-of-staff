<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">Architecture of the Chief</title>
  <desc id="d">You use a dashboard or a terminal. The Chief application launches Claude Code background workers, which read your projects and write notes to a vault. Your data lives in a separate home folder.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#868b98"/></marker>
  </defs>
  <rect width="1100" height="600" rx="16" fill="#0e1016"/>

  <!-- You -->
  <rect x="30" y="40" width="220" height="290" rx="14" fill="none" stroke="#2a2f3a" stroke-width="1.4"/>
  <text x="46" y="64" fill="#868b98" font-size="12" letter-spacing="2">YOU</text>
  <g fill="#151922" stroke="#7c83ff" stroke-width="1.6"><rect x="46" y="84" width="188" height="72" rx="12"/><rect x="46" y="190" width="188" height="88" rx="12"/></g>
  <g fill="#ececf1" font-size="14" font-weight="600"><text x="62" y="112">Dashboard</text><text x="62" y="218">Terminal</text></g>
  <g fill="#868b98" font-size="11.5">
    <text x="62" y="131">in your browser</text><text x="62" y="147">127.0.0.1 only</text>
    <text x="62" y="237">Claude Code, opened in</text><text x="62" y="253">the Chief folder</text><text x="62" y="269">(CLAUDE.md = its rules)</text>
  </g>

  <!-- the application -->
  <rect x="310" y="40" width="470" height="290" rx="14" fill="#0f1218" stroke="#7c83ff" stroke-width="1.6"/>
  <text x="326" y="64" fill="#7c83ff" font-size="12" letter-spacing="2">THE CHIEF · THIS REPOSITORY, CODE ONLY</text>
  <g fill="#151922" stroke="#2a2f3a" stroke-width="1.4">
    <rect x="326" y="84" width="205" height="62" rx="10"/><rect x="559" y="84" width="205" height="62" rx="10"/>
    <rect x="326" y="164" width="205" height="62" rx="10"/><rect x="559" y="164" width="205" height="62" rx="10"/>
    <rect x="326" y="244" width="205" height="62" rx="10"/><rect x="559" y="244" width="205" height="62" rx="10"/>
  </g>
  <g fill="#ececf1" font-size="13.5" font-weight="600">
    <text x="340" y="109">Dashboard server</text><text x="573" y="109">Request pipeline</text>
    <text x="340" y="189">Prompts · languages</text><text x="573" y="189">CLI and helpers</text>
    <text x="340" y="269">Curation · onboarding</text><text x="573" y="269">Data folder · migrations</text>
  </g>
  <g fill="#868b98" font-size="11.5">
    <text x="340" y="128">app/server.py · API · 10 s ticker</text><text x="573" y="128">phases · approvals · auto review</text>
    <text x="340" y="208">prompts.py · prompts_pt.py · i18n</text><text x="573" y="208">chief.py · settings · sessions</text>
    <text x="340" y="288">promote drafts to the vault</text><text x="573" y="288">home.py · schema · backups</text>
  </g>

  <!-- Claude Code -->
  <rect x="870" y="40" width="200" height="170" rx="14" fill="none" stroke="#2a2f3a" stroke-width="1.4"/>
  <text x="886" y="64" fill="#868b98" font-size="12" letter-spacing="2">CLAUDE CODE</text>
  <rect x="884" y="80" width="172" height="116" rx="12" fill="#151922" stroke="#3ecf8e" stroke-width="1.6"/>
  <text x="898" y="106" fill="#ececf1" font-size="14" font-weight="600">Workers</text>
  <g fill="#868b98" font-size="11.5">
    <text x="898" y="126">one background session</text><text x="898" y="142">per phase</text>
    <text x="898" y="164">Model and provider: set in</text><text x="898" y="180">your Claude Code</text>
  </g>

  <!-- bottom row -->
  <g fill="#151922" stroke="#2a2f3a" stroke-width="1.4">
    <rect x="30" y="400" width="300" height="160" rx="14"/><rect x="390" y="400" width="300" height="160" rx="14"/><rect x="750" y="400" width="320" height="160" rx="14"/>
  </g>
  <g fill="#868b98" font-size="12" letter-spacing="2"><text x="46" y="426">YOUR DATA (A SEPARATE FOLDER)</text><text x="406" y="426">YOUR VAULT (OPTIONAL)</text><text x="766" y="426">YOUR PROJECTS</text></g>
  <g fill="#ececf1" font-size="13.5" font-weight="600"><text x="46" y="452">The Chief's home</text><text x="406" y="452">Notes</text><text x="766" y="452">Git repositories</text></g>
  <g fill="#868b98" font-size="11.5">
    <text x="46" y="474">projects.json · your settings</text><text x="46" y="492">state/ · requests, to-dos, workers,</text><text x="46" y="508">   artifacts, implementation worktrees</text><text x="46" y="526">schema.json · backups/</text>
    <text x="406" y="474">inbox/ · drafts the workers leave</text><text x="406" y="492">wiki/ · what the curator promotes</text><text x="406" y="508">every curation is two git commits,</text><text x="406" y="526">so it can be reverted</text>
    <text x="766" y="474">in the folders you configure</text><text x="766" y="492">each implementation runs in its own</text><text x="766" y="508">git worktree, never in your checkout</text><text x="766" y="526">nothing is pushed, ever</text>
  </g>

  <!-- arrows (none of them cross) -->
  <g stroke="#868b98" stroke-width="1.6" fill="none">
    <path d="M250 120H324" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M250 234H308" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M780 125H868" marker-end="url(#a)"/>
    <path d="M320 332V398" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M540 332V398" marker-end="url(#a)"/>
    <path d="M960 198V398" marker-end="url(#a)"/>
    <path d="M910 198V368H620V398" marker-end="url(#a)"/>
  </g>
  <g fill="#868b98" font-size="11" text-anchor="middle">
    <text x="288" y="112">HTTP + token</text><text x="279" y="226">CLI</text>
    <text x="824" y="115">launch · poll</text><text x="824" y="141">· stop</text>
    <text x="297" y="368" transform="rotate(90 297 368)">config + state</text>
    <text x="517" y="368" transform="rotate(90 517 368)">curation</text>
    <text x="1004" y="300" transform="rotate(90 1004 300)">read the code · use worktrees</text>
    <text x="765" y="360">notes to the inbox</text>
  </g>
</svg>
