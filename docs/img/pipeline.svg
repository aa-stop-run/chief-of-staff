<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">How a request moves through the Chief</title>
  <desc id="d">Spec, plan, an independent plan validation, implementation in its own git worktree, an independent review, a local commit, and your merge. You approve at each gate.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#868b98"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f4676b"/></marker>
  </defs>
  <rect width="940" height="480" rx="16" fill="#0e1016"/>

  <!-- row 1 -->
  <g fill="#151922" stroke="#7c83ff" stroke-width="1.6">
    <rect x="40" y="60" width="150" height="64" rx="12"/><rect x="350" y="60" width="150" height="64" rx="12"/>
  </g>
  <g fill="#10231c" stroke="#3ecf8e" stroke-width="1.6"><rect x="525" y="60" width="170" height="64" rx="12"/></g>
  <g fill="#2a2010" stroke="#f5a524" stroke-width="1.6">
    <rect x="215" y="72" width="110" height="40" rx="20"/><rect x="720" y="72" width="110" height="40" rx="20"/>
  </g>
  <g fill="#ececf1" font-size="14" font-weight="600" text-anchor="middle">
    <text x="115" y="88">1 · Spec</text><text x="425" y="88">2 · Plan</text><text x="610" y="88">Plan validator</text>
  </g>
  <g fill="#868b98" font-size="11.5" text-anchor="middle">
    <text x="115" y="107">a worker writes it</text><text x="425" y="107">a worker writes it</text><text x="610" y="107">fresh context · read-only</text>
  </g>
  <g fill="#f5a524" font-size="13" font-weight="600" text-anchor="middle"><text x="270" y="97">You approve</text><text x="775" y="97">You approve</text></g>
  <g stroke="#868b98" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M190 92H213"/><path d="M325 92H348"/><path d="M500 92H523"/><path d="M695 92H718"/>
  </g>

  <!-- loop: validator back to plan -->
  <path d="M610 58V30H425V58" stroke="#f4676b" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#r)"/>
  <text x="517" y="22" fill="#f4676b" font-size="11.5" text-anchor="middle">BLOCKED: the findings go back to the planner (up to 2 rounds)</text>

  <!-- connector between the rows -->
  <path d="M830 92H880V200H20V300H38" stroke="#868b98" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- row 2 -->
  <g fill="#151922" stroke="#7c83ff" stroke-width="1.6"><rect x="40" y="268" width="190" height="64" rx="12"/></g>
  <g fill="#10231c" stroke="#3ecf8e" stroke-width="1.6"><rect x="270" y="268" width="190" height="64" rx="12"/></g>
  <g fill="#151922" stroke="#2a2f3a" stroke-width="1.6"><rect x="500" y="268" width="150" height="64" rx="12"/></g>
  <g fill="#2a2010" stroke="#f5a524" stroke-width="1.6"><rect x="690" y="280" width="170" height="40" rx="20"/></g>
  <g fill="#ececf1" font-size="14" font-weight="600" text-anchor="middle">
    <text x="135" y="296">3 · Implementation</text><text x="365" y="296">4 · Independent review</text><text x="575" y="296">Commit</text>
  </g>
  <g fill="#868b98" font-size="11.5" text-anchor="middle">
    <text x="135" y="315">own git worktree · tests first</text><text x="365" y="315">re-runs the whole test suite</text><text x="575" y="315">local · never pushed</text>
  </g>
  <text x="775" y="305" fill="#f5a524" font-size="13" font-weight="600" text-anchor="middle">You accept and merge</text>
  <g stroke="#868b98" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M230 300H268"/><path d="M460 300H498"/><path d="M650 300H688"/>
  </g>

  <!-- loop: review back to the implementer -->
  <path d="M365 334V390H135V334" stroke="#f4676b" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#r)"/>
  <text x="250" y="410" fill="#f4676b" font-size="11.5" text-anchor="middle">BLOCKED: the findings go back to the implementer (up to 3 rounds)</text>

  <!-- legend -->
  <g font-size="12" fill="#868b98">
    <rect x="40" y="440" width="16" height="16" rx="4" fill="#151922" stroke="#7c83ff" stroke-width="1.6"/><text x="64" y="453">a worker (a Claude Code session)</text>
    <rect x="290" y="440" width="16" height="16" rx="4" fill="#10231c" stroke="#3ecf8e" stroke-width="1.6"/><text x="314" y="453">an independent check, by a worker that never saw the other one's context</text>
    <rect x="730" y="440" width="16" height="16" rx="8" fill="#2a2010" stroke="#f5a524" stroke-width="1.6"/><text x="754" y="453">your decision</text>
  </g>
</svg>
